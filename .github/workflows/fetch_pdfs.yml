name: Monthly PDF Fetcher

on:
  schedule:
    # 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab for testing

jobs:
  fetch-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -r backend/requirements-ai.txt

      - name: Run Fetch Script
        env:
          GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}
          # Override save dir to a relative path for the CI environment
          SAVE_DIR: ./backend/data/brochures
        run: |
          python backend/fetch_pdfs.py

      - name: Run AI Extraction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: ./backend
        run: |
          # Only run if there are new PDFs downloaded (the directory wouldn't be empty)
          # fetch_pdfs.py exits cleanly if there are no updates.
          python -m ai_services.pipeline

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force add all generated data files so they bypass gitignore
          git add -f backend/data/brochures/*.pdf || true
          git add -f backend/data/extracted_products.json || true
          git add -f backend/data/chroma_db/ || true
          
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: Auto-update monthly PDFs and Embeddings"
          git push
